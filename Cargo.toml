[package]
name = "gopher-orch"
version = "0.1.0"
edition = "2021"
authors = ["GopherSecurity"]
description = "Rust SDK for Gopher Orch - AI Agent orchestration framework"
license = "MIT"
repository = "https://github.com/GopherSecurity/gopher-mcp-rust"
keywords = ["ai", "agent", "mcp", "llm", "orchestration"]
categories = ["api-bindings", "development-tools"]

[lib]
name = "gopher_orch"
path = "src/lib.rs"

[[example]]
name = "client_example_json"
path = "examples/client_example_json.rs"

[dependencies]
libloading = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# None needed - we use runtime loading

[features]
default = []
