[package]
name = "auth-mcp-server"
version = "0.1.0"
edition = "2021"
description = "OAuth-protected MCP server example using gopher-auth"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP types
http = "1"

# FFI bindings to gopher-auth
libloading = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
once_cell = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
